name: Harness Recovery CI

on:
  push:
    branches:
      - chatgpt-harness-recovery
  pull_request:
    paths:
      - 'po-agent-platform-v2/**'
      - '.github/workflows/harness-recovery-ci.yml'
  workflow_dispatch:

jobs:
  backend-recovery:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: po-agent-platform-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: po-agent-platform-v2/pyproject.toml
      - name: Install backend
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Run recovery acceptance suite
        run: >-
          pytest -q
          tests/test_harness_recovery_runtime.py
          tests/test_harness_api_v1.py
          tests/test_harness_runtime_factory.py
          tests/test_final_architecture_regressions.py
          tests/test_harness_dialogue_runtime.py
          tests/test_harness_dialogue_learning.py
          tests/test_harness_llm_semantic_interpreter.py
          tests/test_harness_entity_grounding.py
          tests/test_harness_learned_semantics.py
          tests/test_harness_acceptance_corpus.py
          tests/test_harness_portfolio_skills.py
          tests/test_harness_task_filters.py
          tests/test_harness_task_intelligence.py
          tests/test_harness_sprint_intelligence.py
          tests/test_harness_team_intelligence.py
          tests/test_harness_team_matching.py
          tests/test_harness_historical_intelligence.py
          tests/test_harness_release_intelligence.py
          tests/test_harness_po_assistant.py
          tests/test_task_api_as21_adapter.py
          tests/test_harness_task_api_e2e.py
          tests/test_harness_source_readiness.py
          tests/test_harness_source_contracts.py
          tests/test_harness_operational_history.py
          tests/test_harness_session_context.py
          tests/test_harness_feedback.py
          tests/test_harness_eval_store.py
          tests/test_harness_failure_miner.py
          tests/test_harness_improvement_candidates.py
          tests/test_harness_offline_evaluator.py
          tests/test_candidate_lifecycle.py
          tests/test_harness_version_governance.py
          tests/test_skill_catalog.py

  backend-hermetic-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: po-agent-platform-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: po-agent-platform-v2/pyproject.toml
      - name: Install backend
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Run hermetic regression
        run: >-
          pytest -q
          --ignore=tests/test_integration_real_services.py
          --ignore=tests/test_llm_real_integration.py
          --ignore=tests/test_agent_full_integration.py
          --ignore=tests/test_orchestrator_skill_integration.py
          --ignore=tests/test_frontend_config.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: po-agent-platform-v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: po-agent-platform-v2/frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Typecheck and build
        run: npm run build
