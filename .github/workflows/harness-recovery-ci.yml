name: Harness Recovery CI

on:
  push:
    branches:
      - chatgpt-harness-recovery
  pull_request:
    paths:
      - 'po-agent-platform-v2/**'
      - '.github/workflows/harness-recovery-ci.yml'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: po-agent-platform-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: po-agent-platform-v2/pyproject.toml
      - name: Install backend
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Run backend test suite
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: po-agent-platform-v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: po-agent-platform-v2/frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Typecheck and build
        run: npm run build
