[project]
name = "mcp-swtr"
version = "0.2.7"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nepomnyashchiy.A.I", email = "redacted@sbertech.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography==44.0.0",
    "fastmcp==3.4.2",
    "python-dotenv==1.2.2",
    "pydantic==2.13.4",
    "httpx==0.28.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Указываем uvx вызывать модуль mcp_server напрямую
[project.scripts]
mcp-swtr = "mcp_server:main"

[tool.hatch.build.targets.wheel]
include = [
    "__init__.py",
    "mcp_server.py",
    "models"
]
